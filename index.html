<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scott Vogelgesang</title>
<meta name="description" content="Scott Vogelgesang, Senior Product Manager @ Ford. I build small tools to scratch my own itch.">
<meta property="og:title" content="Scott Vogelgesang">
<meta property="og:description" content="Senior Product Manager @ Ford. I build small tools to scratch my own itch.">
<meta property="og:url" content="https://scottvogelgesang.com/">
<meta property="og:type" content="website">
<link rel="canonical" href="https://scottvogelgesang.com/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)" id="tc-light">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" id="tc-dark">
<script>
  // Apply a saved Light/Dark choice before first paint (no flash). Default is System.
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2; --surface: #fcfcfb; --surface-2: #f0efec; --border: #e2e1dc;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974; --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --surface-2: #232321; --border: #2e2e2b;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8e8d86; --accent: #5b9cf0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --surface-2: #232321; --border: #2e2e2b;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8e8d86; --accent: #5b9cf0;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; }
main { flex: 1; display: flex; align-items: center; width: 100%; max-width: 640px; margin: 0 auto; padding: 48px 24px; }
h1 { margin: 0; font-size: clamp(34px, 8vw, 52px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 700; }
.role { margin: 12px 0 0; font-size: clamp(18px, 4.4vw, 21px); font-weight: 550; color: var(--text); }
.lede { margin: 6px 0 0; font-size: clamp(18px, 4.4vw, 21px); color: var(--text-2); max-width: 36ch; text-wrap: pretty; }
.links { display: flex; flex-wrap: wrap; gap: 10px; margin: 32px 0 0; padding: 0; list-style: none; }
.links a { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 0 16px;
  border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
  color: var(--text); text-decoration: none; font-weight: 550; font-size: 15px;
  transition: border-color .15s, transform .15s; }
.links a:hover { border-color: var(--text-3); }
.links a:active { transform: scale(.98); }
.links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.links svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
footer { width: 100%; max-width: 640px; margin: 0 auto; padding: 0 24px 28px; display: flex; flex-wrap: wrap;
  gap: 12px 20px; align-items: center; justify-content: space-between; color: var(--text-3); font-size: 13px; }
footer p { margin: 0; }
footer a { color: var(--text-2); }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; }
.seg button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent;
  color: var(--text-2); font: inherit; font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .links a { transition: none; } }
</style>
</head>
<body>
<main>
  <div>
    <h1>Scott Vogelgesang</h1>
    <p class="role">Senior Product Manager @ Ford</p>
    <p class="lede">I build small tools to scratch my own itch.</p>
    <ul class="links">
      <li><a href="https://github.com/gauchogel" rel="me noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.72 1.22 1.88.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.66 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/></svg>
        GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/scottvogelgesang/" rel="me noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.63 0H2.37A2.37 2.37 0 0 0 0 2.37v11.26A2.37 2.37 0 0 0 2.37 16h11.26A2.37 2.37 0 0 0 16 13.63V2.37A2.37 2.37 0 0 0 13.63 0ZM4.9 13.4H2.53V6.05H4.9Zm-1.18-8.4a1.37 1.37 0 1 1 0-2.74 1.37 1.37 0 0 1 0 2.74Zm9.75 8.4H11.1V9.83c0-.85-.02-1.95-1.19-1.95-1.19 0-1.37.93-1.37 1.89v3.63H6.17V6.05h2.27v1h.03a2.49 2.49 0 0 1 2.24-1.23c2.4 0 2.84 1.58 2.84 3.63Z"/></svg>
        LinkedIn</a></li>
    </ul>
  </div>
</main>
<footer>
  <p>Built with ❤️ by <a href="https://github.com/gauchogel" rel="noopener">@gauchogel</a></p>
  <div class="seg" role="group" aria-label="Theme">
    <button type="button" data-theme-choice="system">System</button>
    <button type="button" data-theme-choice="light">Light</button>
    <button type="button" data-theme-choice="dark">Dark</button>
  </div>
</footer>
<script>
(function () {
  const root = document.documentElement;
  const bars = { light: "#f4f4f2", dark: "#111110" };
  function apply(choice) {
    if (choice === "system") delete root.dataset.theme; else root.dataset.theme = choice;
    document.getElementById("tc-light").content = choice === "system" ? bars.light : bars[choice];
    document.getElementById("tc-dark").content = choice === "system" ? bars.dark : bars[choice];
    document.querySelectorAll("[data-theme-choice]").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.themeChoice === choice)));
  }
  let saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  apply(saved === "light" || saved === "dark" ? saved : "system");
  document.querySelectorAll("[data-theme-choice]").forEach(b => b.onclick = () => {
    const c = b.dataset.themeChoice;
    try { c === "system" ? localStorage.removeItem("theme") : localStorage.setItem("theme", c); } catch (e) {}
    apply(c);   // plain CSS variables here, so no reload needed
  });
})();
</script>
</body>
</html>
